version: '3.8'

services:
  agent-cloud-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open-ai-agent-cloud
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
    volumes:
      - agent_workspace:/app/workspace
      - agent_state:/app

volumes:
  agent_workspace:
    driver: local
  agent_state:
    driver: local
